name: Sarela agent checks
on:
  pull_request:
    paths:
      - 'agent_service/**'
      - 'backend/src/main/java/com/finora/app/agents/**'
      - 'frontend/src/app/agents/**'
      - 'frontend/src/app/app.component.*'
      - 'frontend/src/app/landing/landing.component.html'
      - '.github/workflows/sarela-agents.yml'
  push:
    branches: [feature/sarela-agent-hub-v1]
jobs:
  python:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r agent_service/requirements.txt httpx
      - run: python -m unittest agent_service.test_finance -v
  backend:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: cd backend && mvn -B -ntp test
  frontend:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci && npm run build
