name: Sarela agent checks
on:
  pull_request:
    paths:
      - 'agent_service/**'
      - 'backend/src/main/java/com/finora/app/agents/**'
      - 'frontend/src/app/**'
      - 'frontend/src/styles.css'
      - '.github/workflows/sarela-agents.yml'
  workflow_dispatch:
concurrency:
  group: sarela-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r agent_service/requirements.txt httpx
      - run: python -m unittest agent_service.test_finance -v
  backend:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: cd backend && mvn -B -ntp test
  frontend:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci && npm run build
      - run: cd frontend && npm test -- --watch=false --browsers=ChromeHeadless
