name: Sarela backend checks
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/sarela-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sarela-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
