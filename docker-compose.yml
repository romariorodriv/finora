services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finora
      POSTGRES_USER: finora
      POSTGRES_PASSWORD: finora_local
    volumes:
      - finora_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finora"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/finora
      DB_USER: finora
      DB_PASSWORD: finora_local
      JWT_SECRET: cambia-este-secreto-antes-de-produccion-123456789
      DEMO_DATA: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/integrations/gmail/callback}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-finora-local-demo-key-change-me}
      GMAIL_INITIAL_SYNC_DAYS: ${GMAIL_INITIAL_SYNC_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  finora_data:
