# Local development only. Production uses explicit migrations and ddl-auto=validate.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finora
      POSTGRES_USER: finora
      POSTGRES_PASSWORD: finora_local
    volumes:
      - finora_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finora"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/finora
      DB_USERNAME: finora
      DB_PASSWORD: finora_local
      JPA_DDL_AUTO: update
      JWT_SECRET: cambia-este-secreto-antes-de-produccion-123456789
      AUTH_SECURE_COOKIES: "false"
      CATEGORY_SEED_DEFAULTS: "false"
      DEMO_DATA: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/integrations/gmail/callback}
      GOOGLE_LOGIN_REDIRECT_URI: ${GOOGLE_LOGIN_REDIRECT_URI:-http://localhost:8080/api/v1/auth/google/callback}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:4200}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:4200}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-finora-local-demo-key-change-me}
      GMAIL_INITIAL_SYNC_DAYS: ${GMAIL_INITIAL_SYNC_DAYS:-90}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  finora_data:
